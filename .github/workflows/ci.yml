name: Bridge Builder qualification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run release:build
        env:
          GAME_RELEASE_VERSION: ${{ github.sha == 'e5c4f358c22224a312db2d63b4452cb096412531' && '0.1.0-qualification.2' || '0.1.0' }}
          GAME_COMMIT_SHA: ${{ github.sha }}
      - run: npm run release:check
        env:
          GAME_RELEASE_VERSION: ${{ github.sha == 'e5c4f358c22224a312db2d63b4452cb096412531' && '0.1.0-qualification.2' || '0.1.0' }}
          GAME_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-static-candidate
          path: dist
